name: "EUscan sovereignty scan"
description: "Find third-party (non-EU) service dependencies in your repo, grade them A-E and suggest EU alternatives."
author: "EUscan"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Folder to scan, relative to the workspace."
    required: false
    default: "."
  fail-on:
    description: "Fail the step if any finding is in this bucket: personal-data, known-exposure or noise. Empty = never fail."
    required: false
    default: ""

outputs:
  grade:
    description: "A to E, or not-assessed when no package.json was found."
    value: ${{ steps.scan.outputs.grade }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Build EUscan
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --no-audit --no-fund --loglevel=error
        npm run build

    - name: Scan
      id: scan
      shell: bash
      env:
        EUSCAN_CLI: ${{ github.action_path }}/apps/cli/dist/index.js
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        report="$(mktemp)"
        result="$(mktemp)"
        node "$EUSCAN_CLI" scan "$SCAN_PATH" --json > "$result"
        grade="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(String(r.grade))' "$result")"
        echo "grade=$grade" >> "$GITHUB_OUTPUT"

        status=0
        if [ -n "$FAIL_ON" ]; then
          node "$EUSCAN_CLI" scan "$SCAN_PATH" --fail-on "$FAIL_ON" > "$report" || status=$?
        else
          node "$EUSCAN_CLI" scan "$SCAN_PATH" > "$report" || status=$?
        fi
        cat "$report"
        {
          echo "## EUscan: grade $grade"
          echo
          echo '```'
          cat "$report"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

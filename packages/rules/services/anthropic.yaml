  env: ["ANTHROPIC_API_KEY", "ANTHROPIC_BASE_URL"]
  domains: ["api.anthropic.com"]
  docker_images: []
  terraform_providers: []
  github_actions: []
alternatives: [mistral]
migration_effort: medium
confidence: inferred
sources:

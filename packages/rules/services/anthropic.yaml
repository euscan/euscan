    claim: "\"Anthropic\" means Anthropic Ireland, Limited if Customer resides in the EEA, Switzerland or UK, and Anthropic, PBC elsewhere (provider's own terms)"
  - url: https://platform.claude.com/docs/en/build-with-claude/data-residency

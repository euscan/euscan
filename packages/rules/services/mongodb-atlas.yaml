    claim: "Customers located outside the Americas contract with MongoDB Limited (provider's own terms)"
  - url: https://www.mongodb.com/docs/atlas/atlas-data-processing
    claim: "Atlas can localize data processing by region; Charts, Data Federation and Online Archive queries are not regionalized (provider's own docs)"
  - url: https://www.mongodb.com/products/platform/trust/subprocessors
